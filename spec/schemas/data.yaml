PatchOperation:
  description: >-
    A single patch operation. Data ops (`set`) update a JSON Pointer path in
    the surface's data store; node ops mutate the surface's component adjacency
    list. Operations in a `PatchMessage.patch` array are applied in declared
    order, all-or-nothing. Mix data and node ops freely in one batch.
  oneOf:
    - $ref: "#/PatchOperationSet"
    - $ref: "#/PatchOperationSetNode"
    - $ref: "#/PatchOperationDeleteNode"
    - $ref: "#/PatchOperationSetChildren"
    - $ref: "#/PatchOperationInsertChild"
    - $ref: "#/PatchOperationRemoveChild"
  discriminator:
    propertyName: op
    mapping:
      set: "#/PatchOperationSet"
      set-node: "#/PatchOperationSetNode"
      delete-node: "#/PatchOperationDeleteNode"
      set-children: "#/PatchOperationSetChildren"
      insert-child: "#/PatchOperationInsertChild"
      remove-child: "#/PatchOperationRemoveChild"

PatchOperationSet:
  type: object
  required: [op, path, value]
  properties:
    op:
      type: string
      const: set
    path:
      type: string
      format: json-pointer
      description: JSON Pointer to the data location to update
    value:
      description: New value to set at the path
  additionalProperties: false

PatchOperationSetNode:
  type: object
  required: [op, id, component]
  properties:
    op:
      type: string
      const: set-node
    id:
      type: string
      description: Node ID within the target surface's adjacency list
    component:
      $ref: "component.yaml#/Component"
  additionalProperties: false

PatchOperationDeleteNode:
  type: object
  required: [op, id]
  properties:
    op:
      type: string
      const: delete-node
    id:
      type: string
      description: Node ID to remove from the adjacency list
  additionalProperties: false

PatchOperationSetChildren:
  type: object
  required: [op, id, children]
  properties:
    op:
      type: string
      const: set-children
    id:
      type: string
      description: Parent node ID whose children array is replaced
    children:
      type: array
      items:
        type: string
      description: Ordered list of child node IDs
  additionalProperties: false

PatchOperationInsertChild:
  type: object
  required: [op, parent, index, childId]
  properties:
    op:
      type: string
      const: insert-child
    parent:
      type: string
      description: Parent node ID
    index:
      type: integer
      minimum: 0
      description: Zero-based insertion index
    childId:
      type: string
      description: Child node ID to insert
  additionalProperties: false

PatchOperationRemoveChild:
  type: object
  required: [op, parent, childId]
  properties:
    op:
      type: string
      const: remove-child
    parent:
      type: string
      description: Parent node ID
    childId:
      type: string
      description: Child node ID to remove
  additionalProperties: false

KeyedCollection:
  type: object
  description: >-
    A map of stable string keys to record objects. Collections use string keys
    (not array indices) so that patches target records by key path
    (e.g., /users/u-123/name). Display order is maintained in a separate array
    at the orderPath.
  additionalProperties:
    type: object
  example:
    u-123:
      id: "u-123"
      name: "Alice"
    u-456:
      id: "u-456"
      name: "Bob"

ValidationError:
  type: object
  required:
    - message
  properties:
    path:
      type: string
      format: json-pointer
      description: Data path the error relates to (optional for global errors)
    message:
      type: string
      description: Human-readable error message
  additionalProperties: false

TextInput:
  description: >-
    Phase 14 `text-input` component props shape. Extends Phase 13's
    `input_type` field with `description` (D-B3) and `full_width` (D-C4)
    optional props. Documents the runtime shape — the protocol layer still
    treats `component.props` as `additionalProperties: true`.
  type: object
  required: [label]
  properties:
    label:
      type: string
      description: Visible label rendered inside `Field.Label`.
    placeholder:
      type: string
    required:
      type: boolean
    input_type:
      type: string
      description: >-
        Backend-authoritative native input type (`text`, `password`,
        `email`, `tel`, `number`, `url`, …). Defaults to `text` when
        omitted. Takes precedence over any `type` prop (D-E1).
    disabled:
      type: boolean
    description:
      type: string
      description: >-
        Helper text rendered via `Field.Description`. Hidden while an
        `/_errors/{bind}` entry is active.
    full_width:
      type: boolean
      description: >-
        When `true`, the field's `Field.Field` wrapper spans every column
        of its parent `FieldSet` grid.
  additionalProperties: false

Select:
  description: >-
    Phase 14 `select` component props shape. Extends existing Select with
    `placeholder`, `disabled`, `description`, and `full_width` optional
    props (parity with the Svelte component's long-standing prop reads).
  type: object
  required: [label, options]
  properties:
    label:
      type: string
    options:
      type: array
      items:
        $ref: "#/SelectOption"
      description: Array of options rendered inside the dropdown.
    required:
      type: boolean
    placeholder:
      type: string
    disabled:
      type: boolean
    description:
      type: string
    full_width:
      type: boolean
  additionalProperties: false

SelectOption:
  type: object
  required: [value, label]
  properties:
    value:
      type: string
    label:
      type: string
  additionalProperties: false

Checkbox:
  description: >-
    Phase 14 `checkbox` component props shape. Extends the existing
    Checkbox with `description` (D-B3) and `full_width` (D-C4) optional
    props. Renders with `orientation="horizontal"` on its internal
    `Field.Field` wrapper (label on the same row as the checkbox).
  type: object
  required: [label]
  properties:
    label:
      type: string
    disabled:
      type: boolean
    description:
      type: string
    full_width:
      type: boolean
  additionalProperties: false

Textarea:
  description: >-
    Phase 14 `textarea` component (new primitive, D-E3). Multi-line text
    input wrapped in the shared `Field.Field` anatomy. Binds to a string
    path.
  type: object
  required: [label]
  properties:
    label:
      type: string
    placeholder:
      type: string
    rows:
      type: integer
      minimum: 1
      description: >-
        Visible row count forwarded to the native `<textarea rows=…>`
        attribute. Defaults to `4` on the frontend when omitted.
    required:
      type: boolean
    disabled:
      type: boolean
    description:
      type: string
    full_width:
      type: boolean
  additionalProperties: false

RadioGroup:
  description: >-
    Phase 14 `radio-group` component (new primitive, D-E4). Single-choice
    selection exposing all options at once. Binds to a string path (the
    selected option's `value`).
  type: object
  required: [label, options]
  properties:
    label:
      type: string
    options:
      type: array
      items:
        $ref: "#/RadioOption"
      description: >-
        Per-option entries. Each option carries a `value`, a `label`,
        and an optional `description` rendered as muted 12px text under
        the option label.
    required:
      type: boolean
    disabled:
      type: boolean
    description:
      type: string
    full_width:
      type: boolean
  additionalProperties: false

RadioOption:
  type: object
  required: [value, label]
  properties:
    value:
      type: string
    label:
      type: string
    description:
      type: string
      description: >-
        Optional per-option helper text rendered below the option label
        in muted 12px text.
  additionalProperties: false

Switch:
  description: >-
    Phase 14 `switch` component (new primitive, D-E4). Boolean toggle
    with a horizontal label layout (label left, control right). Binds to
    a boolean path.
  type: object
  required: [label]
  properties:
    label:
      type: string
    disabled:
      type: boolean
    description:
      type: string
    full_width:
      type: boolean
  additionalProperties: false

FieldSet:
  description: >-
    Phase 14 `field-set` structural component (new primitive, D-C1).
    Wraps form-field children in a shadcn `Field.Set` with an optional
    legend + description and an auto-responsive grid (1 col mobile / 2
    cols from `md:`). `cols=N` overrides the grid to a fixed N columns
    at all viewport widths (D-C4).
  type: object
  properties:
    legend:
      type: string
    description:
      type: string
    cols:
      type: integer
      minimum: 1
      maximum: 255
      description: >-
        Fixed column count override. When set, the grid is applied at
        all viewport widths; when omitted, the grid is responsive (1
        col mobile / 2 cols from `md:`).
  additionalProperties: false

FieldSeparator:
  description: >-
    Phase 14 `field-separator` structural component (new primitive,
    D-C2). Renders a thin horizontal `<Field.Separator />` line between
    sibling `FieldSet`s inside a `Form`. No props, no children.
  type: object
  properties: {}
  additionalProperties: false

DataTable:
  description: >-
    Phase 13 `data-table` component props shape. This section documents the
    structured props that DataTable accepts; the runtime validator treats
    `component.props` as `additionalProperties: true` (see component.yaml),
    so these fields are permissive at the protocol layer — this schema is
    the canonical reference for tooling and generated types.
  type: object
  properties:
    columns:
      type: array
      items:
        $ref: "#/DataTableColumn"
      description: Column definitions (required on every DataTable).
    filters:
      type: array
      items:
        $ref: "#/DataTableFilter"
      description: >-
        Optional filter-bar declarations (Phase 13 D-B2). Each entry
        produces a shadcn primitive at render time.
    total_rows:
      type: integer
      minimum: 0
      description: >-
        Optional total row count known server-side (Phase 13 D-D3). When
        set, the frontend sentinel idles once `rows.length >= total_rows`.
    row_id_key:
      type: string
      description: >-
        Optional field name on each row object that DataTable uses as the
        stable row identifier. Defaults to `"id"` on the frontend.
    source:
      type: string
      description: >-
        Optional identifier passed to the `fetch-rows` action dispatch
        (Phase 13 D-H1). The backend's generic `fetch-rows` handler maps
        this string to a per-screen fetcher.
    page_size:
      type: integer
      minimum: 1
      description: Default page size for initial render and pagination chunks.
  required: [columns]
  additionalProperties: false

DataTableColumn:
  description: >-
    Column definition for a DataTable. Phase 13 adds the `kind` and
    `hidden_default` fields (D-F1, D-E2).
  type: object
  required: [key, label]
  properties:
    key:
      type: string
      description: Row-object field name this column reads.
    label:
      type: string
      description: Visible column header text.
    sortable:
      type: boolean
      description: If true, header click fires a `sort` action.
    kind:
      type: string
      enum: [text, badge, actions, date, number]
      description: >-
        Cell render kind (Phase 13 D-F1). Defaults to `text`. The `actions`
        kind expects `row[col.key]` to be an array of `{label, action}`
        objects and renders a DropdownMenu.
    hidden_default:
      type: boolean
      description: >-
        If true, the column starts hidden on mount. User can toggle it via
        the DataTable's "Columns" dropdown. Per-mount state only, not
        persisted across reloads (D-E1).
  additionalProperties: false

DataTableFilter:
  description: >-
    Phase 13 filter-bar entry (D-B2). Tagged union keyed by `kind`.
  oneOf:
    - $ref: "#/DataTableFilterText"
    - $ref: "#/DataTableFilterSelect"
    - $ref: "#/DataTableFilterDateRange"
  discriminator:
    propertyName: kind
    mapping:
      text: "#/DataTableFilterText"
      select: "#/DataTableFilterSelect"
      date-range: "#/DataTableFilterDateRange"

DataTableFilterText:
  type: object
  required: [id, kind]
  properties:
    id:
      type: string
    kind:
      type: string
      const: text
    label:
      type: string
    placeholder:
      type: string
    span:
      type: integer
      minimum: 1
  additionalProperties: false

DataTableFilterSelect:
  type: object
  required: [id, kind, options]
  properties:
    id:
      type: string
    kind:
      type: string
      const: select
    label:
      type: string
    options:
      type: array
      items:
        type: object
        required: [value, label]
        properties:
          value:
            type: string
          label:
            type: string
        additionalProperties: false
    span:
      type: integer
      minimum: 1
  additionalProperties: false

DataTableFilterDateRange:
  type: object
  required: [id, kind]
  properties:
    id:
      type: string
    kind:
      type: string
      const: date-range
    label:
      type: string
    span:
      type: integer
      minimum: 1
  additionalProperties: false
