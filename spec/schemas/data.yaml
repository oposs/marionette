PatchOperation:
  description: >-
    A single patch operation. Data ops (`set`) update a JSON Pointer path in
    the surface's data store; node ops mutate the surface's component adjacency
    list. Operations in a `PatchMessage.patch` array are applied in declared
    order, all-or-nothing. Mix data and node ops freely in one batch.
  oneOf:
    - $ref: "#/PatchOperationSet"
    - $ref: "#/PatchOperationSetNode"
    - $ref: "#/PatchOperationDeleteNode"
    - $ref: "#/PatchOperationSetChildren"
    - $ref: "#/PatchOperationInsertChild"
    - $ref: "#/PatchOperationRemoveChild"
  discriminator:
    propertyName: op
    mapping:
      set: "#/PatchOperationSet"
      set-node: "#/PatchOperationSetNode"
      delete-node: "#/PatchOperationDeleteNode"
      set-children: "#/PatchOperationSetChildren"
      insert-child: "#/PatchOperationInsertChild"
      remove-child: "#/PatchOperationRemoveChild"

PatchOperationSet:
  type: object
  required: [op, path, value]
  properties:
    op:
      type: string
      const: set
    path:
      type: string
      format: json-pointer
      description: JSON Pointer to the data location to update
    value:
      description: New value to set at the path
  additionalProperties: false

PatchOperationSetNode:
  type: object
  required: [op, id, component]
  properties:
    op:
      type: string
      const: set-node
    id:
      type: string
      description: Node ID within the target surface's adjacency list
    component:
      $ref: "component.yaml#/Component"
  additionalProperties: false

PatchOperationDeleteNode:
  type: object
  required: [op, id]
  properties:
    op:
      type: string
      const: delete-node
    id:
      type: string
      description: Node ID to remove from the adjacency list
  additionalProperties: false

PatchOperationSetChildren:
  type: object
  required: [op, id, children]
  properties:
    op:
      type: string
      const: set-children
    id:
      type: string
      description: Parent node ID whose children array is replaced
    children:
      type: array
      items:
        type: string
      description: Ordered list of child node IDs
  additionalProperties: false

PatchOperationInsertChild:
  type: object
  required: [op, parent, index, childId]
  properties:
    op:
      type: string
      const: insert-child
    parent:
      type: string
      description: Parent node ID
    index:
      type: integer
      minimum: 0
      description: Zero-based insertion index
    childId:
      type: string
      description: Child node ID to insert
  additionalProperties: false

PatchOperationRemoveChild:
  type: object
  required: [op, parent, childId]
  properties:
    op:
      type: string
      const: remove-child
    parent:
      type: string
      description: Parent node ID
    childId:
      type: string
      description: Child node ID to remove
  additionalProperties: false

KeyedCollection:
  type: object
  description: >-
    A map of stable string keys to record objects. Collections use string keys
    (not array indices) so that patches target records by key path
    (e.g., /users/u-123/name). Display order is maintained in a separate array
    at the orderPath.
  additionalProperties:
    type: object
  example:
    u-123:
      id: "u-123"
      name: "Alice"
    u-456:
      id: "u-456"
      name: "Bob"

ValidationError:
  type: object
  required:
    - message
  properties:
    path:
      type: string
      format: json-pointer
      description: Data path the error relates to (optional for global errors)
    message:
      type: string
      description: Human-readable error message
  additionalProperties: false

DataTable:
  description: >-
    Phase 13 `data-table` component props shape. This section documents the
    structured props that DataTable accepts; the runtime validator treats
    `component.props` as `additionalProperties: true` (see component.yaml),
    so these fields are permissive at the protocol layer — this schema is
    the canonical reference for tooling and generated types.
  type: object
  properties:
    columns:
      type: array
      items:
        $ref: "#/DataTableColumn"
      description: Column definitions (required on every DataTable).
    filters:
      type: array
      items:
        $ref: "#/DataTableFilter"
      description: >-
        Optional filter-bar declarations (Phase 13 D-B2). Each entry
        produces a shadcn primitive at render time.
    total_rows:
      type: integer
      minimum: 0
      description: >-
        Optional total row count known server-side (Phase 13 D-D3). When
        set, the frontend sentinel idles once `rows.length >= total_rows`.
    row_id_key:
      type: string
      description: >-
        Optional field name on each row object that DataTable uses as the
        stable row identifier. Defaults to `"id"` on the frontend.
    source:
      type: string
      description: >-
        Optional identifier passed to the `fetch-rows` action dispatch
        (Phase 13 D-H1). The backend's generic `fetch-rows` handler maps
        this string to a per-screen fetcher.
    page_size:
      type: integer
      minimum: 1
      description: Default page size for initial render and pagination chunks.
  required: [columns]
  additionalProperties: false

DataTableColumn:
  description: >-
    Column definition for a DataTable. Phase 13 adds the `kind` and
    `hidden_default` fields (D-F1, D-E2).
  type: object
  required: [key, label]
  properties:
    key:
      type: string
      description: Row-object field name this column reads.
    label:
      type: string
      description: Visible column header text.
    sortable:
      type: boolean
      description: If true, header click fires a `sort` action.
    kind:
      type: string
      enum: [text, badge, actions, date, number]
      description: >-
        Cell render kind (Phase 13 D-F1). Defaults to `text`. The `actions`
        kind expects `row[col.key]` to be an array of `{label, action}`
        objects and renders a DropdownMenu.
    hidden_default:
      type: boolean
      description: >-
        If true, the column starts hidden on mount. User can toggle it via
        the DataTable's "Columns" dropdown. Per-mount state only, not
        persisted across reloads (D-E1).
  additionalProperties: false

DataTableFilter:
  description: >-
    Phase 13 filter-bar entry (D-B2). Tagged union keyed by `kind`.
  oneOf:
    - $ref: "#/DataTableFilterText"
    - $ref: "#/DataTableFilterSelect"
    - $ref: "#/DataTableFilterDateRange"
  discriminator:
    propertyName: kind
    mapping:
      text: "#/DataTableFilterText"
      select: "#/DataTableFilterSelect"
      date-range: "#/DataTableFilterDateRange"

DataTableFilterText:
  type: object
  required: [id, kind]
  properties:
    id:
      type: string
    kind:
      type: string
      const: text
    label:
      type: string
    placeholder:
      type: string
    span:
      type: integer
      minimum: 1
  additionalProperties: false

DataTableFilterSelect:
  type: object
  required: [id, kind, options]
  properties:
    id:
      type: string
    kind:
      type: string
      const: select
    label:
      type: string
    options:
      type: array
      items:
        type: object
        required: [value, label]
        properties:
          value:
            type: string
          label:
            type: string
        additionalProperties: false
    span:
      type: integer
      minimum: 1
  additionalProperties: false

DataTableFilterDateRange:
  type: object
  required: [id, kind]
  properties:
    id:
      type: string
    kind:
      type: string
      const: date-range
    label:
      type: string
    span:
      type: integer
      minimum: 1
  additionalProperties: false
