[workspace]
resolver = "3"
members = [
    "crates/marionette-protocol",
    "crates/marionette-macros",
    "crates/marionette",
    "crates/crm-demo",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/oetiker/marionette"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "mock"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
bcrypt = "0.19"
chrono = { version = "0.4", features = ["serde"] }
axum-extra = { version = "0.12", features = ["cookie"] }
time = "0.3"
darling = "0.23"
futures = "0.3"
tokio-tungstenite = "0.26"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
